name: Release wheel
on:
  workflow_call:
permissions:
  contents: read
jobs:
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.13.4"
      - run: uv sync --locked --dev --python 3.12
      - run: uv run ruff check .
      - name: Check release version
        run: |
          uv run python - <<'PYTHON'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if os.environ["GITHUB_REF_NAME"] != f"v{version}":
              raise SystemExit("Tag must match the package version")
          PYTHON
          test -z "$(git ls-files logos/)"
      - name: Build the canonical notebook delivery
        run: |
          uv run python scripts/build_notebook.py
          uv run python scripts/build_notebook.py --check
          git diff --exit-code -- notebooks/generate_video.ipynb
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --generate-notes notebooks/*.whl notebooks/generate_video.ipynb
