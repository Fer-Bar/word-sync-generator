name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.13.4"
      - run: uv sync --locked --dev --python 3.12
      - run: uv run playwright install --with-deps chromium
      - run: uv run ruff check .
      - name: Install FFmpeg and FFprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Prepare pinned Switzer from Fontshare
        run: |
          uv run python - <<'PYTHON'
          from hashlib import sha256
          from karaoke_app.lyrics_plus import FONT_DIRECTORY, switzer_font

          switzer_font()
          expected = {
              "Switzer-Semibold.otf": "0b1652d8384fcd5038dc19317ab0e0c4f4b7317e6a9729d8ef38fba375b01921",
              "Switzer-FFL.txt": "145e7fe2429a3336ba215c070ef722000e01348a3e1baaa127e871bb5012f554",
          }
          for name, digest in expected.items():
              path = FONT_DIRECTORY / name
              if not path.is_file() or sha256(path.read_bytes()).hexdigest() != digest:
                  raise SystemExit(f"Unverified Switzer file: {name}. Review Fontshare source and license before updating pins.")
          PYTHON
      - run: uv run pytest -q -rs
      - run: uv build
