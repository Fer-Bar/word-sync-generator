[project]
name = "lyrics-generator"
version = "0.1.12"
license = "Apache-2.0"
description = "Generate karaoke and lyrics videos with a portable GPU pipeline"
requires-python = ">=3.12"
dependencies = [
    "google-colab-cli==0.6.0",
    "jupyter-kernel-client==0.15.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.2.3",
    "pillow>=12.3.0",
    "numpy>=2.5.3",
    "imageio-ffmpeg>=0.6.0",
    "playwright>=1.55,<2",
    "lyricsgenius>=3.7,<4",
    "yt-dlp[default]>=2026.10.26",
    "rich>=15.0.0",
]

[project.scripts]
karaoke = "karaoke_app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "packaging>=25",
    "pytest>=9.1.1",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["src/karaoke_app"]

[tool.hatch.build.targets.wheel.force-include]
"THIRD_PARTY_NOTICES.md" = "karaoke_app/THIRD_PARTY_NOTICES.md"
"colab/karaoke_job.py" = "karaoke_app/runtime/karaoke_job.py"
"colab/karaoke_launch.py" = "karaoke_app/runtime/karaoke_launch.py"
"colab/requirements.txt" = "karaoke_app/runtime/requirements.txt"

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    ".uv-cache",
    ".venv",
    "ENV",
    "__pycache__",
    "env",
    "venv",
    "**/migrations/**",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
